# ~~ Generated by cdk-express-pipeline. To modify, edit your pipeline and run `cdk synth`
name: CDK Express Pipeline Deploy - Stage
concurrency:
  group: cdk-express-pipeline-deploy-stage
  cancel-in-progress: false
on:
  push:
    branches:
      - stage
jobs:
  synth__stage:
    name: Synth stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-synth
        with:
          command: pnpm cdk synth '**' -c env=stage --output=cdk.out/stage
          cloud-assembly-directory: infra/cdk.out/stage
          working-directory: infra
  deploy__stage___backend_app_api:
    name: "[stage] 📦 backend_app_api"
    needs:
      - synth__stage
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Deploy
        uses: ./.github/actions/cdk-express-pipeline-deploy
        with:
          stack-selector-patterns: backend_app_api
          cloud-assembly-directory: infra/cdk.out/stage
          command: pnpm cdk deploy backend_app_api --app=cdk.out/stage --concurrency 10
            --require-approval never --exclusively
          assume-role-arn: arn:aws:iam::581184285249:role/github-oidc-role
          assume-region: us-east-1
          working-directory: infra
  deploy__stage___frontend_app_website:
    name: "[stage] 📦 frontend_app_website"
    needs:
      - deploy__stage___backend_app_api
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Deploy
        uses: ./.github/actions/cdk-express-pipeline-deploy
        with:
          stack-selector-patterns: frontend_app_website
          cloud-assembly-directory: infra/cdk.out/stage
          command: pnpm cdk deploy frontend_app_website --app=cdk.out/stage --concurrency
            10 --require-approval never --exclusively
          assume-role-arn: arn:aws:iam::581184285249:role/github-oidc-role
          assume-region: us-east-1
          working-directory: infra
