          command: pnpm build && pnpm cdk synth '**' -c env=dev --output=cdk.out/dev
          cloud-assembly-directory: infra/cdk.out/dev
          working-directory: infra
  diff__dev:
    name: ${{ matrix.job-name }}
    needs:
      - synth__dev
    runs-on: ubuntu-latest
