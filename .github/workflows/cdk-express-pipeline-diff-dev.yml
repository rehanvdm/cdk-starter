            cloud-assembly-directory: infra/cdk.out/dev
            stack-selector-patterns: backend_app_*
            command: pnpm cdk diff backend_app_* --app=cdk.out/dev
            assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
            assume-region: us-east-1
