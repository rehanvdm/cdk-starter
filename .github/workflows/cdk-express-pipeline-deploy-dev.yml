name: CDK Express Pipeline Deploy - Dev
concurrency:
  group: cdk-express-pipeline-deploy-dev
  cancel-in-progress: false
on:
  push:
    branches:
      - develop
jobs:
  synth__dev:
    name: Synth dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-synth
        with:
          command: pnpm cdk synth '**' -c env=dev --output=cdk.out/dev
          cloud-assembly-directory: infra/cdk.out/dev
          working-directory: infra
  deploy__dev___backend_app_api:
    name: "[dev] 📦 backend_app_api"
    needs:
      - synth__dev
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Deploy
        uses: ./.github/actions/cdk-express-pipeline-deploy
        with:
          stack-selector-patterns: backend_app_api
          cloud-assembly-directory: infra/cdk.out/dev
          command: pnpm cdk deploy backend_app_api --app=cdk.out/dev --concurrency 10
            --require-approval never --exclusively
          assume-role-arn: arn:aws:iam::581184285249:role/github-oidc-role
          assume-region: us-east-1
          working-directory: infra
  deploy__dev___frontend_app_website:
    name: "[dev] 📦 frontend_app_website"
    needs:
      - deploy__dev___backend_app_api
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Deploy
        uses: ./.github/actions/cdk-express-pipeline-deploy
        with:
          stack-selector-patterns: frontend_app_website
          cloud-assembly-directory: infra/cdk.out/dev
          command: pnpm cdk deploy frontend_app_website --app=cdk.out/dev --concurrency 10
            --require-approval never --exclusively
          assume-role-arn: arn:aws:iam::581184285249:role/github-oidc-role
          assume-region: us-east-1
          working-directory: infra
