# ~~ Generated by cdk-express-pipeline. To modify, edit your pipeline and run `cdk synth`
name: CDK Express Pipeline Diff - Prod
on:
  pull_request:
    branches:
      - main
jobs:
  synth__prod:
    name: Synth prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-synth
        with:
          command: pnpm build:assets && pnpm cdk synth '**' -c env=prod
            --output=cdk.out/prod
          cloud-assembly-directory: infra/cdk.out/prod
          working-directory: infra
  diff__prod:
    name: ${{ matrix.job-name }}
    needs:
      - synth__prod
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    strategy:
      matrix:
        include:
          - job-name: Diff prod - backend__app
            cloud-assembly-directory: infra/cdk.out/prod
            stack-selector-patterns: backend_app_*
            command: pnpm cdk diff backend_app_* --app=cdk.out/prod
            assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
            assume-region: us-east-1
          - job-name: Diff prod - frontend__app
            cloud-assembly-directory: infra/cdk.out/prod
            stack-selector-patterns: frontend_app_*
            command: pnpm cdk diff frontend_app_* --app=cdk.out/prod
            assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
            assume-region: us-east-1
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-diff
        with:
          job-name: ${{ matrix.job-name }}
          stack-selector-patterns: ${{ matrix.stack-selector-patterns }}
          cloud-assembly-directory: ${{ matrix.cloud-assembly-directory }}
          command: ${{ matrix.command }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          assume-role-arn: ${{ matrix.assume-role-arn }}
          assume-region: ${{ matrix.assume-region }}
  print_diff:
    name: Print Diff
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    needs:
      - diff__prod
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Update PR Description
        uses: rehanvdm/cdk-express-pipeline-github-diff@v0.1.3
        with:
          mode: print
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cloud-assemblies: '[{"header":"CDK Diff - prod","directory":"infra/cdk.out/prod"}]'
