name: CDK Express Pipeline Deploy - Prod
concurrency:
  group: cdk-express-pipeline-deploy-prod
  cancel-in-progress: false
on:
  push:
    branches:
      - main
jobs:
  synth__prod:
    name: Synth prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Synth
        uses: ./.github/actions/cdk-express-pipeline-synth
        with:
          command: pnpm build && pnpm cdk synth '**' -c env=prod --output=cdk.out/prod
          cloud-assembly-directory: infra/cdk.out/prod
          working-directory: infra
  deploy__prod___backend_app_api-dev:
    name: "[prod] 📦 backend_app_api-dev"
    needs:
      - synth__prod
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run CDK Express Pipeline Deploy
        uses: ./.github/actions/cdk-express-pipeline-deploy
        with:
          stack-selector-patterns: backend_app_api-dev
          cloud-assembly-directory: infra/cdk.out/prod
          command: pnpm cdk deploy backend_app_api-dev --app=cdk.out/prod --concurrency 10
            --require-approval never --exclusively
          assume-role-arn: arn:aws:iam::581184285249:role/githuboidc-git-hub-deploy-role
          assume-region: us-east-1
          working-directory: infra
  deploy__prod___frontend_app_website-dev:
    name: "[prod] 📦 frontend_app_website-dev"
